# SPDX-License-Identifier: GPL-3.0-or-later
[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.95
allow = ["GPL-3.0-or-later", "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "CC0-1.0", "Unicode-3.0", "BSL-1.0"]

# Unmodified embedded font assets, retained under their own licenses; see M3 review.
[[licenses.exceptions]]
name = "epaint_default_fonts"
version = "=0.31.1"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# Tauri's exact MPL-2.0 dependencies; retain notices and MPL-covered source.
[[licenses.exceptions]]
name = "cssparser"
version = "=0.37.0"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "cssparser-macros"
version = "=0.7.1"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "dtoa-short"
version = "=0.3.5"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "option-ext"
version = "=0.2.0"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "selectors"
version = "=0.38.0"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

