[workspace]
members = ["crates/timebase", "crates/event-engine", "tools/offline-render"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
timebase = { path = "crates/timebase" }
event-engine = { path = "crates/event-engine" }
