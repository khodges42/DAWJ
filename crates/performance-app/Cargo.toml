[package]
name = "dawj"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
audio-backend = { path = "../audio-backend" }
parts.workspace = true
timebase.workspace = true
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# Already used by eframe; encode opt-in native smoke captures without desktop capture.
image = { version = "=0.25.9", default-features = false, features = ["png"] }
midir = { version = "=0.10.3", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[lints]
workspace = true
