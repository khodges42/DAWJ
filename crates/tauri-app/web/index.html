<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css"><title>DAWJ Tauri evaluation</title></head><body><header><h1>DAWJ</h1><select id="device" aria-label="Output device"></select><button id="start">Start output</button><button id="stop">Stop output</button><select id="theme" aria-label="Theme"><option>dark</option><option>light</option><option>high-contrast</option></select><label>Accent <input id="accent" type="color" value="#73c5df"></label><label>Custom CSS <input id="css" type="file" accept=".css,text/css"></label><button id="reset-style">Reset custom CSS</button></header><p id="clock">Output offline</p><main id="decks"></main><footer><label>A <input id="cross" type="range" min="0" max="1" step="0.01" value="0.5"> B</label><p id="notice">Stereo master only; no independent headphone cue.</p><p id="metrics"></p></footer><style id="user-style"></style><script type="module" src="app.js"></script></body></html>
